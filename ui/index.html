<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>りんりくん</title>
<link rel="icon" type="image/svg+xml" href="/ui/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  try {
    const t = localStorage.getItem("rinrikun-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<header>
  <div class="header-top">
    <div class="mast">
      <h1>りんりくん</h1>
      <p class="sub">rinrikun — anime taste map</p>
    </div>
    <button id="theme" aria-label="Toggle theme" title="Toggle theme"></button>
  </div>
  <nav>
    <button data-tab="profile" class="on">Profile</button>
    <button data-tab="review">Review</button>
    <button data-tab="similar">Similar</button>
    <button data-tab="recs">Recommendations</button>
    <button data-tab="watched">Watched</button>
  </nav>
</header>
<main>
  <section id="tab-profile"></section>
  <section id="tab-review" hidden>
    <div class="deck-top">
      <div class="deck-title-row">
        <h2>Library review</h2>
        <div class="deck-progress" id="deck-progress">0 rated</div>
      </div>
      <div class="deck-filter-row">
        <button class="pill active" id="deck-filter-unrated" data-filter="unrated">Unrated only</button>
        <button class="pill" id="deck-filter-all" data-filter="all">All watched</button>
      </div>
    </div>

    <div id="deck-wrap"></div>

    <div class="deck-controls">
      <div class="tier-buttons">
        <button class="btn-tier tier-d" data-tier="D" title="Press 1 or D"><span class="tier-key">1</span><span class="tier-label">Disliked</span><span class="tier-mult">0.0× · D</span></button>
        <button class="btn-tier tier-c" data-tier="C" title="Press 2 or C"><span class="tier-key">2</span><span class="tier-label">Meh</span><span class="tier-mult">0.3× · C</span></button>
        <button class="btn-tier tier-b" data-tier="B" title="Press 3 or B"><span class="tier-key">3</span><span class="tier-label">Liked</span><span class="tier-mult">1.0× · B</span></button>
        <button class="btn-tier tier-a" data-tier="A" title="Press 4 or A"><span class="tier-key">4</span><span class="tier-label">Favorite</span><span class="tier-mult">1.5× · A</span></button>
        <button class="btn-tier tier-s" data-tier="S" title="Press 5 or S"><span class="tier-key">5</span><span class="tier-label">Masterpiece</span><span class="tier-mult">2.0× · S</span></button>
      </div>
      <div class="deck-nav-buttons">
        <button class="btn-action" id="deck-undo" title="Backspace or ←">↺ Undo</button>
        <button class="btn-action" id="deck-skip" title="Space or →">Skip →</button>
      </div>
    </div>
  </section>
  <section id="tab-similar" hidden>
    <div class="search-wrap">
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="q" placeholder="Search by title to find similar shows…" autocomplete="off" spellcheck="false">
        <button id="q-clear" class="search-clear" aria-label="Clear search" hidden>✕</button>
      </div>
      <div id="qlist" hidden></div>
    </div>
    <div id="similar-header" class="result-header" hidden></div>
    <div id="similar-empty" class="empty-state">
      <div class="empty-suggestions" id="similar-suggestions"></div>
    </div>
    <div id="sresults" class="cards"></div>
  </section>
  <section id="tab-recs" hidden>
    <div id="recs-seed-bar"></div>
    <div class="recs-filter-row">
      <div class="filter-group">
        <span class="filter-label">Format:</span>
        <div class="filter-pills" id="recs-format-pills">
          <button class="pill active" data-format="all">All</button>
          <button class="pill" data-format="tv">TV</button>
          <button class="pill" data-format="movie">Movie</button>
          <button class="pill" data-format="ova">OVA</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Min Score:</span>
        <div class="filter-pills" id="recs-score-pills">
          <button class="pill active" data-score="0">Any</button>
          <button class="pill" data-score="7.0">★ 7.0+</button>
          <button class="pill" data-score="7.5">★ 7.5+</button>
          <button class="pill" data-score="8.0">★ 8.0+</button>
        </div>
      </div>
    </div>
    <div id="rresults" class="cards"></div>
  </section>
  <section id="tab-watched" hidden>
    <div class="watched-head">
      <h2>Manually added shows</h2>
      <div class="watched-count-badge" id="watched-count-badge">0 shows</div>
    </div>
    <div id="wresults" class="cards"></div>
  </section>
</main>
<dialog id="detail-modal"></dialog>
<script src="/ui/app.js"></script>
</body>
</html>
