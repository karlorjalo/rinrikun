<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>りんりくん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  try {
    const t = localStorage.getItem("rinrikun-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<header>
  <button id="theme" aria-label="Toggle theme" title="Toggle theme"></button>
  <div class="mast">
    <h1>りんりくん</h1>
    <p class="sub">rinrikun — anime taste map</p>
    <nav>
      <button data-tab="profile" class="on">Profile</button>
      <button data-tab="similar">Similar</button>
      <button data-tab="recs">Recommendations</button>
    </nav>
  </div>
</header>
<main>
  <section id="tab-profile"></section>
  <section id="tab-similar" hidden>
    <input id="q" placeholder="Type a title…" autocomplete="off">
    <div id="qlist"></div>
    <div id="sresults" class="cards"></div>
  </section>
  <section id="tab-recs" hidden>
    <button id="recenter">From taste center</button>
    <span id="seedlabel"></span>
    <div id="rresults" class="cards"></div>
  </section>
</main>
<script src="/ui/app.js"></script>
</body>
</html>
