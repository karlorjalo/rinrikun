<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>りんりくん</title>
<link rel="icon" type="image/svg+xml" href="/ui/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  try {
    const t = localStorage.getItem("rinrikun-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<header>
  <div class="header-top">
    <div class="mast">
      <h1>りんりくん</h1>
      <p class="sub">rinrikun — anime taste map</p>
    </div>
    <button id="theme" aria-label="Toggle theme" title="Toggle theme"></button>
  </div>
  <nav>
    <button data-tab="profile" class="on">Profile</button>
    <button data-tab="review">Review</button>
    <button data-tab="ratings">Ratings</button>
    <button data-tab="similar">Similar</button>
    <button data-tab="recs">Recommendations</button>
  </nav>
</header>
<main>
  <section id="tab-profile"></section>
  <section id="tab-review" hidden>
    <div class="deck-top">
      <div class="deck-title-row">
        <h2>Library review</h2>
        <div class="deck-progress" id="deck-progress">0 rated</div>
      </div>
      <div class="deck-filter-row">
        <button class="pill active" id="deck-filter-unrated" data-filter="unrated">Unrated only</button>
        <button class="pill" id="deck-filter-all" data-filter="all">All watched</button>
      </div>
    </div>

    <div id="deck-wrap"></div>

    <div class="deck-controls">
      <div class="tier-buttons">
        <button class="btn-tier tier-d" data-tier="D" title="Press 1 or D"><span class="tier-key">1</span><span class="tier-label">Disliked</span><span class="tier-mult">D</span></button>
        <button class="btn-tier tier-c" data-tier="C" title="Press 2 or C"><span class="tier-key">2</span><span class="tier-label">Meh</span><span class="tier-mult">C</span></button>
        <button class="btn-tier tier-b" data-tier="B" title="Press 3 or B"><span class="tier-key">3</span><span class="tier-label">Liked</span><span class="tier-mult">B</span></button>
        <button class="btn-tier tier-a" data-tier="A" title="Press 4 or A"><span class="tier-key">4</span><span class="tier-label">Favorite</span><span class="tier-mult">A</span></button>
        <button class="btn-tier tier-s" data-tier="S" title="Press 5 or S"><span class="tier-key">5</span><span class="tier-label">Masterpiece</span><span class="tier-mult">S</span></button>
      </div>
      <div class="deck-nav-buttons">
        <button class="btn-action" id="deck-undo" title="Backspace or ←">↺ Undo</button>
        <button class="btn-action" id="deck-skip" title="Space or →">Skip →</button>
      </div>
    </div>
  </section>
  <section id="tab-ratings" hidden>
    <div class="ratings-head">
      <div class="ratings-title-row">
        <h2>Ratings</h2>
        <div class="watched-count-badge" id="ratings-count-badge">0 rated</div>
      </div>
      <div class="ratings-filter-bar">
        <div class="filter-group">
          <span class="filter-label">Tier:</span>
          <div class="filter-pills" id="ratings-tier-pills">
            <button class="pill active" data-tier="all">All</button>
            <button class="pill" data-tier="S">S <span class="pill-count" id="count-tier-s">0</span></button>
            <button class="pill" data-tier="A">A <span class="pill-count" id="count-tier-a">0</span></button>
            <button class="pill" data-tier="B">B <span class="pill-count" id="count-tier-b">0</span></button>
            <button class="pill" data-tier="C">C <span class="pill-count" id="count-tier-c">0</span></button>
            <button class="pill" data-tier="D">D <span class="pill-count" id="count-tier-d">0</span></button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Show:</span>
          <div class="filter-pills" id="ratings-source-pills">
            <button class="pill active" data-source="rated">Rated</button>
            <button class="pill" data-source="manual" title="Shows that you marked as watched and that are not in the library">Manually added <span class="pill-count" id="count-manual">0</span></button>
            <button class="pill" data-source="dismissed" title="Shows that you removed from the recommendations">Not interested <span class="pill-count" id="count-dismissed">0</span></button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Sort:</span>
          <div class="filter-pills" id="ratings-sort-pills">
            <button class="pill active" data-sort="tier">Tier</button>
            <button class="pill" data-sort="match">Match</button>
            <button class="pill" data-sort="score">Score</button>
            <button class="pill" data-sort="title">Title</button>
          </div>
        </div>
      </div>
    </div>
    <div class="cards" id="ratings-grid"></div>
  </section>
  <section id="tab-similar" hidden>
    <div class="search-wrap">
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="q" placeholder="Search by title to find similar shows…" autocomplete="off" spellcheck="false">
        <button id="q-clear" class="search-clear" aria-label="Clear search" hidden>✕</button>
      </div>
      <div id="qlist" hidden></div>
    </div>
    <div id="similar-header" class="result-header" hidden></div>
    <div id="similar-empty" class="empty-state">
      <div class="empty-suggestions" id="similar-suggestions"></div>
    </div>
    <div id="sresults" class="cards"></div>
  </section>
  <section id="tab-recs" hidden>
    <div id="recs-seed-bar"></div>
    <div class="vector-map-wrap" id="recs-vector-map-wrap">
      <div class="vector-map-header">
        <div class="vector-map-title">
          <span>Recommendation Map</span>
          <span class="vector-map-sub">2D Vector Space</span>
        </div>
        <div class="vector-map-legend">
          <div class="vector-view-pills" data-canvas="recs-vector-canvas">
            <button class="pill active" data-view="posters">Posters</button>
            <button class="pill" data-view="dots">Dots</button>
          </div>
          <span class="legend-item"><i class="legend-dot dot-catalog"></i> Catalog</span>
          <span class="legend-item"><i class="legend-dot dot-library"></i> Watched</span>
          <span class="legend-item legend-tiers" title="A watched show has the color of its tier"><i class="legend-dot dot-tier-s"></i>S <i class="legend-dot dot-tier-a"></i>A <i class="legend-dot dot-tier-b"></i>B <i class="legend-dot dot-tier-c"></i>C <i class="legend-dot dot-tier-d"></i>D</span>
          <span class="legend-item"><b class="legend-star">✦</b> Recommended</span>
        </div>
      </div>
      <div class="vector-canvas-box">
        <canvas id="recs-vector-canvas"></canvas>
        <div class="vector-map-tooltip" id="recs-vector-tooltip" hidden></div>
      </div>
    </div>
    <div class="recs-filter-row">
      <div class="filter-group" id="recs-formula-group">
        <span class="filter-label">Formula:</span>
        <div class="filter-pills" id="recs-formula-pills">
          <button class="pill" data-kinds="usual" title="Shows of the kinds that your library has many of move up">My usual kinds</button>
          <button class="pill" data-kinds="all" title="The kind of a show does not change its position">All kinds</button>
        </div>
      </div>
      <div class="filter-group">
        <div class="filter-pills" id="recs-switches">
          <button class="pill" id="recs-variety" aria-pressed="false" title="Give results that are less similar to each other">More variety</button>
          <button class="pill" id="recs-sequels" aria-pressed="false" title="Also show sequels and side stories of shows that you own">Include sequels</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Format:</span>
        <div class="filter-pills" id="recs-format-pills">
          <button class="pill active" data-format="all">All</button>
          <button class="pill" data-format="tv">TV</button>
          <button class="pill" data-format="movie">Movie</button>
          <button class="pill" data-format="ova">OVA</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Min Score:</span>
        <div class="filter-pills" id="recs-score-pills">
          <button class="pill active" data-score="0">Any</button>
          <button class="pill" data-score="7.0">★ 7.0+</button>
          <button class="pill" data-score="7.5">★ 7.5+</button>
          <button class="pill" data-score="8.0">★ 8.0+</button>
        </div>
      </div>
    </div>
    <div id="recs-formula-note" class="recs-formula-note"></div>
    <div id="recs-undo-bar"></div>
    <div id="rresults" class="cards"></div>
  </section>
</main>
<dialog id="detail-modal"></dialog>
<script src="/ui/app.js"></script>
</body>
</html>
