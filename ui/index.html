<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>りんりくん</title>
<link rel="icon" type="image/svg+xml" href="/ui/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  try {
    const t = localStorage.getItem("rinrikun-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<header>
  <button id="theme" aria-label="Toggle theme" title="Toggle theme"></button>
  <div class="mast">
    <h1>りんりくん</h1>
    <p class="sub">rinrikun — anime taste map</p>
    <nav>
      <button data-tab="profile" class="on">Profile</button>
      <button data-tab="similar">Similar</button>
      <button data-tab="recs">Recommendations</button>
    </nav>
  </div>
</header>
<main>
  <section id="tab-profile"></section>
  <section id="tab-similar" hidden>
    <div class="search-wrap">
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="q" placeholder="Search by title to find similar shows…" autocomplete="off" spellcheck="false">
        <button id="q-clear" class="search-clear" aria-label="Clear search" hidden>✕</button>
      </div>
      <div id="qlist" hidden></div>
    </div>
    <div id="similar-header" class="result-header" hidden></div>
    <div id="similar-empty" class="empty-state">
      <div class="empty-icon">⌘</div>
      <h3>Explore Semantic Nearest Neighbors</h3>
      <p>Search across your library and the AniList pool to discover shows that share narrative, stylistic, and thematic DNA.</p>
      <div class="empty-suggestions" id="similar-suggestions"></div>
    </div>
    <div id="sresults" class="cards"></div>
  </section>
  <section id="tab-recs" hidden>
    <button id="recenter">From taste center</button>
    <span id="seedlabel"></span>
    <div id="rresults" class="cards"></div>
  </section>
</main>
<dialog id="detail-modal"></dialog>
<script src="/ui/app.js"></script>
</body>
</html>
